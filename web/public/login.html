<!DOCTYPE html>
<html lang="en" data-theme-default="{{theme_default}}">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex,nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in &middot; {{.Hostname}}</title>
  <link rel="icon" href="{{favicon_url}}">
  <link rel="preload" href="/fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{{asset "/styles/main.css"}}">
  {{theme_bootstrap}}
  {{umami_script}}
</head>
<body>
  <button class="theme-toggle" type="button" aria-label="Switch theme"><i data-lucide="monitor"></i></button>
  <main class="page page-narrow">
    <header class="hero">
      <img class="logo" src="{{logo_url}}" alt="">
      <h1 class="hostname">{{.Hostname}}</h1>
      <p class="tagline">Sign in to continue</p>
    </header>

    <section class="card">
      {{if .FlashErr}}<p class="flash flash-error" role="alert">{{.FlashErr}}</p>{{end}}
      {{if .Flash}}<p class="flash flash-ok">{{.Flash}}</p>{{end}}

      <form method="post" action="/login" autocomplete="on" novalidate>
        <input type="hidden" name="csrf" value="{{.CSRFToken}}">
        <input type="hidden" name="next" value="{{.Next}}">

        <label class="field">
          <span class="field-label">Username</span>
          <input class="field-input" type="text" name="username"
                 autocomplete="username" autocapitalize="none" autocorrect="off"
                 spellcheck="false" required autofocus>
        </label>

        <label class="field">
          <span class="field-label">Password</span>
          <input class="field-input" type="password" name="password"
                 autocomplete="current-password" required>
        </label>

        <button class="btn-primary btn-block" type="submit">Sign in</button>
      </form>
    </section>

    <footer class="footer">
      <span class="footer-version">{{if build_version}}{{build_version}}{{end}}</span>
      <span class="footer-mid">{{with contact_url}}<a href="{{.}}">contact</a>{{end}}{{with privacy_url}}<a href="{{.}}">privacy</a>{{end}}</span>
      <a class="footer-link" href="https://github.com/xenofex7/transfer" target="_blank" rel="noopener">
        <i data-lucide="git-branch"></i><span>source on github</span>
      </a>
    </footer>
  </main>

  <script src="{{asset "/scripts/lucide.min.js"}}" defer></script>
  <script src="{{asset "/scripts/tooltip.js"}}" defer></script>
  <script src="{{asset "/scripts/dialog.js"}}" defer></script>
  <script src="{{asset "/scripts/forms.js"}}" defer></script>
  <script src="{{asset "/scripts/theme-toggle.js"}}" defer></script>
</body>
</html>
